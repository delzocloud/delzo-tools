name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Every job declares the minimum it needs.
permissions: {}

# One run per PR (or per main push) at a time; never cancel a deploy halfway.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Gate for every deploy: nothing reaches a preview or production unless this passes.
  checks:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install scripts are disabled in .npmrc (ignore-scripts=true).
      - run: npm ci

      # Every package must come from the npm registry with a valid signature.
      - name: Verify registry signatures
        run: npm audit signatures

      # Blocks on high/critical advisories. Moderate/low show up in the log only.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - run: npm test

      - run: npm run build

  # Static analysis of the workflows themselves (template injection, excessive
  # permissions, unpinned actions, credential persistence...).
  workflow-lint:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Plain mode: fails the job on findings instead of uploading SARIF.
          advanced-security: false

  # Flags new dependencies with known vulnerabilities or disallowed licenses.
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [checks, workflow-lint, dependency-review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in jobs that hold deploy secrets (cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - name: Slugify branch name
        id: slug
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "branch_slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker Preview (never touches production routes)
        id: preview
        # `wrangler preview` creates/updates a Preview under the existing
        # delzo-tools Worker. Routes and custom domains only apply to production,
        # so tools.delzo.cloud is never modified here. Needs Wrangler >= 4.135.
        # Wrangler is the version pinned in package.json (no npx downloads).
        run: |
          set -euo pipefail
          # Worker secrets come from GitHub secrets: written to a 0600 temp file,
          # uploaded with this version and deleted. Never echoed or committed.
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node scripts/write-worker-secrets.mjs "$SECRETS_FILE"
          npx wrangler preview \
            --secrets-file "$SECRETS_FILE" \
            --worker-name delzo-tools \
            --name "$PREVIEW_NAME" \
            --message "PR #${PR_NUMBER} ${GITHUB_SHA::7}" \
            --json > preview.out
          cat preview.out
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("preview.out", "utf8");
            let url = "", unique = "";
            try {
              const j = JSON.parse(raw.slice(raw.indexOf("{")));
              url = (j.preview && j.preview.urls || [])[0] || "";
              unique = (j.deployment && j.deployment.urls || [])[0] || "";
            } catch (e) {
              const m = raw.match(/https:\/\/[a-z0-9.-]+\.workers\.dev/gi) || [];
              url = m[0] || ""; unique = m[1] || "";
            }
            if (!url) { console.error("No Preview URL in wrangler output (are Preview URLs enabled?)"); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\nunique_url=${unique}\n`);
          '
        env:
          PREVIEW_NAME: ${{ steps.slug.outputs.branch_slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IPGEOLOCATION_API_KEY: ${{ secrets.IPGEOLOCATION_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          UNIQUE_URL: ${{ steps.preview.outputs.unique_url }}
          PREVIEW_NAME: ${{ steps.slug.outputs.branch_slug }}
        with:
          script: |
            const { PREVIEW_URL, UNIQUE_URL, PREVIEW_NAME } = process.env;
            const body = [
              '🚀 **Preview deployed!**',
              '',
              `Preview URL: ${PREVIEW_URL}`,
              UNIQUE_URL ? `Esta versión: ${UNIQUE_URL}` : '',
              '',
              `Preview: \`${PREVIEW_NAME}\` (Worker \`delzo-tools\`). Producción (tools.delzo.cloud) no se toca.`,
            ].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');

            // Find existing bot comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, workflow-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      # Wrangler is the version pinned in package.json (before this it was
      # whatever `npx` downloaded as latest on every deploy).
      - name: Deploy to production
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node scripts/write-worker-secrets.mjs "$SECRETS_FILE"
          npx wrangler deploy --secrets-file "$SECRETS_FILE"
        env:
          IPGEOLOCATION_API_KEY: ${{ secrets.IPGEOLOCATION_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci

      - name: Slugify branch name
        id: slug
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "branch_slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete Worker Preview
        continue-on-error: true
        # Deletes only this PR's Preview (and its deployments), never the Worker.
        run: |
          npx wrangler preview delete \
            --worker-name delzo-tools \
            --name "$PREVIEW_NAME" \
            --skip-confirmation
        env:
          PREVIEW_NAME: ${{ steps.slug.outputs.branch_slug }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
