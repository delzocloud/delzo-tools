name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Slugify branch name
        id: slug
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "branch_slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker Preview (never touches production routes)
        id: preview
        # `wrangler preview` creates/updates a Preview under the existing
        # delzo-tools Worker. Routes and custom domains only apply to production,
        # so tools.delzo.cloud is never modified here. Needs Wrangler >= 4.135.
        run: |
          set -euo pipefail
          npx -y wrangler@${WRANGLER_PREVIEW_VERSION} preview \
            --worker-name delzo-tools \
            --name "${{ steps.slug.outputs.branch_slug }}" \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" \
            --json > preview.out
          cat preview.out
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("preview.out", "utf8");
            let url = "", unique = "";
            try {
              const j = JSON.parse(raw.slice(raw.indexOf("{")));
              url = (j.preview && j.preview.urls || [])[0] || "";
              unique = (j.deployment && j.deployment.urls || [])[0] || "";
            } catch (e) {
              const m = raw.match(/https:\/\/[a-z0-9.-]+\.workers\.dev/gi) || [];
              url = m[0] || ""; unique = m[1] || "";
            }
            if (!url) { console.error("No Preview URL in wrangler output (are Preview URLs enabled?)"); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\nunique_url=${unique}\n`);
          '
        env:
          WRANGLER_PREVIEW_VERSION: 4.151.1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          UNIQUE_URL: ${{ steps.preview.outputs.unique_url }}
          PREVIEW_NAME: ${{ steps.slug.outputs.branch_slug }}
        with:
          script: |
            const { PREVIEW_URL, UNIQUE_URL, PREVIEW_NAME } = process.env;
            const body = [
              '🚀 **Preview deployed!**',
              '',
              `Preview URL: ${PREVIEW_URL}`,
              UNIQUE_URL ? `Esta versión: ${UNIQUE_URL}` : '',
              '',
              `Preview: \`${PREVIEW_NAME}\` (Worker \`delzo-tools\`). Producción (tools.delzo.cloud) no se toca.`,
            ].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');

            // Find existing bot comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to production
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Slugify branch name
        id: slug
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "branch_slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete Worker Preview
        continue-on-error: true
        # Deletes only this PR's Preview (and its deployments), never the Worker.
        run: |
          npx -y wrangler@${WRANGLER_PREVIEW_VERSION} preview delete \
            --worker-name delzo-tools \
            --name "${{ steps.slug.outputs.branch_slug }}" \
            --skip-confirmation
        env:
          WRANGLER_PREVIEW_VERSION: 4.151.1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
